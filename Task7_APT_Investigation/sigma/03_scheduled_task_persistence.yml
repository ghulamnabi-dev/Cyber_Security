title: Suspicious Scheduled Task Created for Persistence
id: b1e6f930-2c47-49d8-a5f1-7d02e8c3ab54
status: experimental
description: Detects creation of a scheduled task that runs a script interpreter or
  a binary from a temporary folder. The attacker used a scheduled task to keep
  access after reboot.
author: Ghulam Nabi
date: 2026/07/09
references:
  - https://attack.mitre.org/techniques/T1053/005/
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_suspicious:
    CommandLine|contains:
      - 'powershell'
      - 'cmd.exe /c'
      - 'mshta'
      - '\AppData\'
      - '\Temp\'
      - '\ProgramData\'
      - '\Public\'
  condition: selection_tool and selection_suspicious
fields:
  - CommandLine
  - User
  - ParentImage
falsepositives:
  - Software installers and IT scripts create scheduled tasks. Check the user and the parent process.
level: high
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
