title: LSASS Memory Access for Credential Dumping
id: 4c9d7a12-6b83-4f20-8ed1-59a3c4b7e806
status: experimental
description: Detects a process opening LSASS memory with read rights, which is how
  attackers dump passwords and hashes. In this incident the attacker dumped LSASS
  before moving to other machines.
author: Ghulam Nabi
date: 2026/07/09
references:
  - https://attack.mitre.org/techniques/T1003/001/
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_legit:
    SourceImage|endswith:
      - '\wmiprvse.exe'
      - '\MsMpEng.exe'
      - '\csrss.exe'
  condition: selection and not filter_legit
fields:
  - SourceImage
  - TargetImage
  - GrantedAccess
falsepositives:
  - Antivirus and backup software may read LSASS. Check the SourceImage is signed and expected.
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
